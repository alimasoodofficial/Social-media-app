<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
  <link rel="icon" href="https://www.svgrepo.com/show/478938/nazi-symbol-3.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">

  <title>CRUD POST</title>
</head>

<body>
  <div class="wrapper ">
<div class="main-div   d-flex flex-column  align-items-center justify-content-center w-100 ">



      <nav class="main-heading d-flex align-items-center justify-content-center bg-primary w-100">
        <h1 class="text-white">Social Media App</h1>
      </nav>

      <section class="main-body  w-100  bg-custom-white ">

        <div class="post d-flex flex-column  align-items-center justify-content-center  ">
          <h1 class="bg-danger text-white w-100 text-center">Read Post</h1>
          <div class="read-section ">
            <!-- content here -->

          </div>
          <div class="read-more-container my-4 "></div>

        </div>
        <div class="create-section  ">
          <h1 class="w-100 bg-dark text-white text-center">Create Post </h1>
          <form action="" class="PostForm p-5 d-flex flex-column flex-md-row justify-content-center gap-1">
            <input type="text" id="TitleInput" placeholder="Enter Title" class="">
            <input type="text" id="DescInput" placeholder="Enter Description" class="">
            <button type="submit" class="btn btn-primary ms-2 rounded-3">Submit</button>
          </form>
        </div>



      </section>

    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>

</html>
